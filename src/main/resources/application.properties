spring.application.name=iot-esp32s3
#WEB connection port
server.port=8081
#Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/iot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#jpa
#Automatic data update at application startup
#spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
#Query logging Hibernate
spring.jpa.show-sql=true
#Decorate or beautifully print SQL
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.error.include-message=always
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always
#
#security.ignored=/**
#spring.security.enabled=false
#management.security.enabled=false
#security.basic.enabled=false
# Настройки очистки устаревших данных
# Количество дней хранения телеметрии
data.retention-days=30
# Cron-выражение для планировщика очистки (ежедневно в 03:00) (секунда-минута-час-день-месяц-деньНед).
data.cleanup.cron=0 0 3 * * *